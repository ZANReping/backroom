<!doctype html><html lang="zh"><meta charset="utf-8"><title>Level 3 · 参考重制验收</title>
<style>html,body{margin:0;overflow:hidden;background:#080807}canvas{display:block}nav{position:absolute;top:10px;left:10px;background:#151511d9;color:#e9e4d6;padding:9px;font:13px monospace}button{margin:3px;padding:5px 10px}#status{display:inline-block;min-width:140px}</style>
<canvas id="scene"></canvas><nav><span id="status">加载中</span><button data-v="lit">照明</button><button data-v="dark">晦暗</button><button data-v="narrow">狭窄</button><button data-v="genhall">发电室</button><button data-v="assembly">装配线</button><button data-v="boiler">锅炉房</button><button data-v="sanct">圣所</button><button id="exhibit">栅栏展室</button><button id="mode">切换光影</button></nav>
<aside style="position:absolute;bottom:12px;left:12px;color:#eee;background:#151511cc;padding:8px;font:13px sans-serif">拖动画面环顾 · WASD 移动 · E 开关门</aside>
<script type="module">
import{moveStep}from'/src/game/core/player.ts';
import{Engine}from'/src/game/engine.ts';import{getRenderer,look}from'/src/game/renderer/index.ts';import{genL3ChunkRaw}from'/src/game/world/infiniteL3.ts';import{registerInfiniteLevel,infiniteImplFor}from'/src/game/world/infiniteRegistry.ts';
const engine=new Engine(),renderer=getRenderer(document.querySelector('canvas')),impl=infiniteImplFor(3);let variant='lit',mode='realistic',last=performance.now(),frames=0;
engine.newRun(424242,'normal');engine.dev.god=true;engine.dev.frozenAI=true;engine.dev.statLock=true;engine.paused=true;renderer.resize(innerWidth,innerHeight,1);renderer.setTextureQuality(2);renderer.setBloomFx(true);renderer.setLightMode(mode);
const selectStyle=(v,x,y)=>v!=='mixed'?v:x===0&&y===1?'narrow':x===1&&y===0?'assembly':x===-1&&y===0?'genhall':x===0&&y===-1?'boiler':x===1&&y===1?'sanct':x===-1&&y===1?'dark':'lit';
const setVariant=v=>{variant=v;registerInfiniteLevel(3,{...impl,variantOf:(_,x,y)=>selectStyle(v,x,y),genRaw:(d,s,x,y)=>genL3ChunkRaw(d,s,x,y,selectStyle(v,x,y))});engine.loadLevel(3,{mapSeed:424242,firstVisit:false});engine.introT=0;engine.player.flashlight=false;const inf=engine.map.inf;engine.player.x=(v==='narrow'?13.5:v==='sanct'?16:v==='boiler'?16.5:v==='assembly'?16:14.5)-inf.ox;engine.player.y=(v==='sanct'?26:v==='boiler'?20:v==='genhall'?25:28)-inf.oy;engine.player.z=0;look.yaw=0;look.pitch=v==='sanct'?.13:.015;frames=0;document.querySelector('#status').textContent=v+' · '+mode;return{variant,structures:engine.map.structures.length}};
const setMode=v=>{mode=v;renderer.setLightMode(v);document.querySelector('#status').textContent=variant+' · '+mode};
const mix=document.createElement('button');mix.textContent='区域交界';mix.onclick=()=>setVariant('mixed');document.querySelector('nav').append(mix);
window.qa={engine,renderer,look,setVariant,setMode,stats:()=>({variant,mode,frames,calls:renderer.three.info.render.calls,triangles:renderer.three.info.render.triangles,memory:renderer.three.info.memory}),exhibit(){const s=engine.map.structures.find(s=>s.data?.sealedExhibit);if(!s)return false;const st=engine.map.structures.find(t=>t.data?.exhibit&&Math.abs(t.y-s.y)<3&&Math.abs(t.x-s.x)<4);const sign=st.x>s.x?-1:1;engine.player.x=s.x+.5+sign*2;engine.player.y=s.y+1.5;look.yaw=sign<0?-Math.PI/2:Math.PI/2;look.pitch=0;return{x:s.x,y:s.y}},view(x,z,yaw=0,pitch=0){engine.player.x=x-engine.map.inf.ox;engine.player.y=z-engine.map.inf.oy;look.yaw=yaw;look.pitch=pitch}};
for(const b of document.querySelectorAll('[data-v]'))b.onclick=()=>setVariant(b.dataset.v);document.querySelector('#mode').onclick=()=>setMode(mode==='realistic'?'classic':'realistic');document.querySelector('#exhibit').onclick=()=>qa.exhibit();addEventListener('resize',()=>renderer.resize(innerWidth,innerHeight,1));setVariant(new URLSearchParams(location.search).get('v')||'lit');
const keys=new Set(),canvas=document.querySelector('canvas');let dragging=false;
canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(dragging){look.yaw-=e.movementX*.003;look.pitch=Math.max(-1.2,Math.min(1.2,look.pitch-e.movementY*.003))}};
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&!e.repeat){engine.scanInteract();engine.doInteract()}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),s=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));engine.player.facing=-look.yaw-Math.PI/2;if(f||s){const k=dt*2.4/Math.hypot(f,s);moveStep(engine.map,engine.player,(-Math.sin(look.yaw)*f+Math.cos(look.yaw)*s)*k,(-Math.cos(look.yaw)*f-Math.sin(look.yaw)*s)*k)}renderer.applyView(engine);renderer.render(canvas,engine,{grain:false,flicker:0,shake:false},dt);frames++;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
