<!doctype html><html lang="zh"><meta charset="utf-8"><title>Level 4 · 重制验证</title>
<style>html,body{margin:0;overflow:hidden;background:#222}canvas{display:block}nav{position:absolute;left:12px;top:12px;background:#222d;color:#eee;padding:8px;font:13px sans-serif}button{margin:3px;padding:6px}aside{position:absolute;bottom:12px;left:12px;color:#fff;background:#222b;padding:8px;font:13px sans-serif}</style>
<canvas></canvas><nav><span id="status">加载中</span><button data-v="officehall">办公间</button><button data-v="open">空旷大厅</button><button data-v="smallrooms">小房间</button><button data-v="windowview">窗景</button><button id="stairs">楼梯间</button><button id="oldstairs">古典楼梯</button><button id="decor">无字墙饰</button><button id="corner">虚空转角</button><button id="services">配套房间</button><button id="mode">切换光影</button></nav><aside>拖动环顾 · WASD 行走 · E 开关门</aside>
<script type="module">
import{Engine}from'/src/game/engine.ts';import{getRenderer,look}from'/src/game/renderer/index.ts';import{moveStep}from'/src/game/core/player.ts';import{l4Cell,l4Origin,l4Biome,l4VoidCell,l4VoidAt}from'/src/game/world/l4Layout.ts';import{h32}from'/src/game/world/infinite.ts';
const engine=new Engine(),renderer=getRenderer(document.querySelector('canvas'));let mode='realistic',last=performance.now(),frames=0;
engine.newRun(424242,'normal');engine.dev.god=true;engine.dev.frozenAI=true;engine.dev.statLock=true;engine.paused=true;engine.loadLevel(4,{mapSeed:424242,firstVisit:false});engine.introT=0;engine.player.flashlight=false;renderer.resize(innerWidth,innerHeight,1);renderer.setTextureQuality(2);renderer.setLightMode(mode);renderer.setBloomFx(true);renderer.setLightShadows(1);renderer.setShadowQuality(0);
function view(x,y,yaw=0,pitch=0){engine.player.x=x;engine.player.y=y;engine.player.z=0;engine.player.vz=0;look.yaw=yaw;look.pitch=pitch}
function select(v){const m=engine.map,ox=m.inf.ox,oy=m.inf.oy,tint={officehall:51,open:52,windowview:53,smallrooms:54}[v];let best=null;
 for(let y=10;y<m.h-20;y++)for(let x=10;x<m.w-20;x++)if(m.tint[y*m.w+x]===tint&&m.tiles[y*m.w+x]===1){const X=l4Origin(l4Cell(x+ox))-ox,Y=l4Origin(l4Cell(y+oy))-oy;if(X<5||Y<5||X+20>m.w-5||Y+20>m.h-5)continue;const d=Math.hypot(X+ox-13,Y+oy-13);if(!best||d<best.d)best={X,Y,d}}
 if(best){view(best.X+11,best.Y+18,0,.015);if(v==='windowview'){const wins=m.structures.filter(s=>s.data?.coast&&s.kind==='glasswin'&&s.x>=best.X&&s.x<best.X+20&&s.y>=best.Y&&s.y<best.Y+20);const s=wins[Math.floor(wins.length/2)];if(s){const deg=Number(s.data.deg),dx=deg===90?1:deg===270?-1:0,dy=deg===0?1:deg===180?-1:0;view(s.x+.5-dx*6,s.y+.5-dy*6,Math.atan2(-dx,-dy),.04)}}}
 document.querySelector('#status').textContent=v+' · '+mode;return best}
window.qa={engine,renderer,look,view,select,stats:()=>({frames,calls:renderer.three.info.render.calls,triangles:renderer.three.info.render.triangles,memory:renderer.three.info.memory}),stairs(){const s=engine.map.structures.find(s=>s.kind==='l4stairs');if(!s)return false;view(s.x+1,s.y+.25,Math.PI,0);return{x:s.x,y:s.y}},service(kind='pantry'){const s=engine.map.structures.find(s=>s.kind==='l4prop'&&s.data?.detail===kind&&s.x>8&&s.y>8&&s.x<engine.map.w-10&&s.y<engine.map.h-10);if(!s)return false;view(s.x+s.w/2,s.y+s.h+2.5,0,-.10);document.querySelector('#status').textContent=kind+' · '+mode;return{x:s.x,y:s.y}},mode(v){mode=v;renderer.setLightMode(v)}};
function worldView(x,y,yaw,pitch){view(x-engine.map.inf.ox,y-engine.map.inf.oy,yaw,pitch);engine.updateInfiniteWindow()}
qa.oldstairs=()=>{const seed=engine.map.inf.seed;let best=null;for(let r=-32;r<=32;r++)for(let k=-32;k<=32;k++)if(!l4VoidCell(seed,k,r)&&l4Biome(seed,k,r)==='open'&&h32(seed,0x405,k,r)%160===0){const x=l4Origin(k)+6,y=l4Origin(r)+17,d=Math.hypot(x,y);if(!best||d<best.d)best={x,y,d}}if(best){worldView(best.x+2.3,best.y+.2,.72,-.55);document.querySelector('#status').textContent='古典楼梯 · '+mode}return best};
let decorIndex=0;qa.decor=()=>{const m=engine.map,arr=m.structures.filter(s=>s.kind==='l4prop'&&s.data?.detail==='wallDecor'&&s.x>10&&s.x<m.w-10&&s.y>10&&s.y<m.h-10),s=arr[decorIndex++%arr.length];if(!s)return;const a=Number(s.data.deg)*Math.PI/180;view(s.x+.5+Math.sin(a)*1.6,s.y+.5+Math.cos(a)*1.6,a,0);document.querySelector('#status').textContent='无字墙饰 · '+mode;return{x:s.x,y:s.y}};
qa.corner=()=>{const seed=engine.map.inf.seed;for(let y=0;y<100;y++)for(let x=0;x<100;x++)if(l4VoidAt(seed,x,y)&&!l4VoidAt(seed,x-1,y)&&!l4VoidAt(seed,x,y-1)){worldView(x+6,y+6,Math.PI/4,.36);document.querySelector('#status').textContent='虚空转角 · '+mode;return{x,y}}};
for(const b of document.querySelectorAll('[data-v]'))b.onclick=()=>select(b.dataset.v);document.querySelector('#stairs').onclick=()=>qa.stairs();document.querySelector('#oldstairs').onclick=()=>qa.oldstairs();document.querySelector('#decor').onclick=()=>qa.decor();document.querySelector('#corner').onclick=()=>qa.corner();let serviceIndex=0;document.querySelector('#services').onclick=()=>qa.service(['pantry','toilet','server','archive','printer'][serviceIndex++%5]);document.querySelector('#mode').onclick=()=>qa.mode(mode==='realistic'?'classic':'realistic');select('officehall');
const keys=new Set(),canvas=document.querySelector('canvas');let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(dragging){look.yaw-=e.movementX*.003;look.pitch=Math.max(-1.4,Math.min(1.4,look.pitch-e.movementY*.003))}};addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&!e.repeat){engine.scanInteract();engine.doInteract()}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());addEventListener('resize',()=>renderer.resize(innerWidth,innerHeight,1));
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),s=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));engine.player.facing=-look.yaw-Math.PI/2;if(f||s){const k=dt*2.4/Math.hypot(f,s);moveStep(engine.map,engine.player,(-Math.sin(look.yaw)*f+Math.cos(look.yaw)*s)*k,(-Math.cos(look.yaw)*f-Math.sin(look.yaw)*s)*k,undefined,{z:engine.onStairs?0:engine.player.z})}engine.updateStairs(dt);renderer.applyView(engine);renderer.render(canvas,engine,{grain:false,flicker:0,shake:false},dt);frames++;requestAnimationFrame(frame)}requestAnimationFrame(frame)
</script></html>
