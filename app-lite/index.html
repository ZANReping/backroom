<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script id="toy-sdk" async src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>后室：深入 — Backrooms Roguelike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500&family=Inter:wght@400;700;900&family=Recursive:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Sofia+Sans:wght@400;800&family=Rubik:wght@400;700&family=Overpass+Mono:wght@400;700&family=PT+Mono&family=Share+Tech+Mono&family=Anonymous+Pro:wght@400;700&family=Staatliches&family=PT+Serif:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      /* 本地打包的免费商用字体（Google Fonts 不可得）：
         Fantasque Sans Mono（杰瑞的信众标题）、未来荧黑 Extended（后室装修公司标题/正文）、
         Metropolis（信众正文，Proxima Nova 的免费替代）、字魂扁桃体（装修公司版头，若文件存在）。
         用相对路径 ./fonts/ 以适配子路径部署；浏览器仅在实际渲染到该字体时才下载。 */
      @font-face { font-family: 'Fantasque Sans Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fonts/fantasque-sans-mono-400.woff2') format('woff2'); }
      @font-face { font-family: 'Fantasque Sans Mono'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/fantasque-sans-mono-700.woff2') format('woff2'); }
      @font-face { font-family: '未来荧黑 Extended'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fonts/glow-sans-sc-ext-400.woff2') format('woff2'); }
      @font-face { font-family: '未来荧黑 Extended'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/glow-sans-sc-ext-700.woff2') format('woff2'); }
      /* Metropolis（SIL OFL）：Proxima Nova 的免费替代，杰瑞的信众正文字体 */
      @font-face { font-family: 'Metropolis'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fonts/metropolis-400.woff2') format('woff2'); }
      @font-face { font-family: 'Metropolis'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/metropolis-700.woff2') format('woff2'); }
      /* 字魂扁桃体（SIL OFL 1.1，免费商用）：后室装修公司版头字体 */
      @font-face { font-family: '字魂扁桃体'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fonts/zihunbiantaoti.woff2') format('woff2'); }
      /* ChillGSans 寒蝉高黑体（SIL OFL 1.1，Chill Type，思源黑体衍生）：BNTG 标题/版头中文字体 */
      @font-face { font-family: 'ChillGSans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('./fonts/chillgsans.woff2') format('woff2'); }
      /* Zhi Mang Xing 志莽行（SIL OFL 1.1，Google Fonts）：L3 大幅画作笔记残页手书字体 */
      @font-face { font-family: 'Zhi Mang Xing'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fonts/zhimangxing.ttf') format('truetype'); }
    </style>
    <style>
      /* Critical first paint: no game code, images or remote fonts required. */
      html, body { margin: 0; background: #11100b; }
      #boot-loader { position: fixed; inset: 0; z-index: 99999; overflow: hidden; color: #e5d9ac; background: #292617; font-family: 'Courier New', monospace, sans-serif; transition: opacity .2s ease-out; }
      #boot-loader[data-state="ready"] { opacity: 0; }
      .boot-room { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 34%, #c7bd79 0%, #8c854f 22%, #49482d 58%, #191b12 100%); }
      .boot-wall { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #b9ab6126 0 2px, transparent 2px 20px), linear-gradient(110deg, #292a19, #aca366 60%, #8c814b); clip-path: polygon(0 0, 41% 30%, 41% 66%, 0 100%); }
      .boot-wall-right { transform: scaleX(-1); background: repeating-linear-gradient(90deg, #c5b86f26 0 2px, transparent 2px 20px), linear-gradient(110deg, #181d13, #9c9355 60%, #6d6941); }
      .boot-ceiling { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 59% 30%, 41% 30%); background: repeating-linear-gradient(0deg, transparent 0 70px, #4b483954 71px 73px), repeating-linear-gradient(90deg, #777762 0 100px, #424537 102px 104px); }
      .boot-lamp { position: absolute; top: 5%; left: 43%; width: 14%; height: 12%; clip-path: polygon(0 0, 100% 0, 76% 100%, 24% 100%); background: #edebbb; box-shadow: 0 0 70px #e4e2ab; }
      .boot-lamp-far { top: 23%; left: 48%; width: 4%; height: 3%; opacity: .7; }
      .boot-floor { position: absolute; inset: 0; clip-path: polygon(41% 66%, 59% 66%, 100% 100%, 0 100%); background: repeating-linear-gradient(90deg, transparent 0 2px, #6e633626 3px 4px), linear-gradient(#6b6440 50%, #292518); }
      .boot-door { position: absolute; top: 35%; bottom: 34%; left: 46%; width: 8%; background: linear-gradient(90deg, #151912, #090e0a); border: 2px solid #514e2d; box-shadow: 8px 0 12px #2b301755; }
      .boot-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 37%, transparent 0 15%, #0d100735 50%, #090c09ed 100%), linear-gradient(transparent 40%, #0d100900 50%, #0c0e09 100%); }
      .boot-top { position: absolute; top: max(24px, env(safe-area-inset-top)); left: max(28px, env(safe-area-inset-left)); right: max(28px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: .22em; color: #e3ddae9e; }
      .boot-copy { position: absolute; left: 24px; right: 24px; bottom: max(8%, calc(env(safe-area-inset-bottom) + 24px)); margin: auto; max-width: 430px; text-align: center; }
      .boot-eyebrow { font-size: 10px; letter-spacing: .42em; color: #bdb68a; }
      .boot-title { margin: 14px 0 7px; font-family: serif; font-weight: 400; font-size: clamp(32px, 5vw, 52px); letter-spacing: .22em; text-indent: .22em; }
      .boot-subtitle { margin: 0 0 25px; font-size: 10px; letter-spacing: .46em; color: #aca782; }
      .boot-track { height: 2px; overflow: hidden; background: #ada27324; margin: 0 40px 16px; }
      .boot-track::after { content: ''; display: block; width: 32%; height: 100%; background: #d4c785; animation: boot-signal 2s ease-in-out infinite; }
      #boot-status { font-family: sans-serif; font-size: 12px; letter-spacing: .15em; line-height: 1.8; margin: 0; }
      .boot-note { font-family: serif; font-size: 12px; color: #918b6a; letter-spacing: .18em; margin-top: 28px; }
      #boot-retry { margin: 16px auto 0; background: #cabc8120; color: #e9dcac; border: 1px solid #cabc8170; padding: 10px 24px; cursor: pointer; }
      #boot-retry[hidden] { display: none; }
      #boot-retry:focus-visible { outline: 2px solid #eadb91; outline-offset: 4px; }
      #boot-loader[data-state="error"] .boot-track::after { animation: none; width: 100%; background: #be8565; }
      @keyframes boot-signal { from { transform: translateX(-110%); } to { transform: translateX(420%); } }
      @media (prefers-reduced-motion: reduce) { #boot-loader { transition: none; } .boot-track::after { animation: none; width: 100%; opacity: .6; } }
      @media (max-height: 480px) { .boot-copy { bottom: 20px; } .boot-title { font-size: 30px; margin: 6px 0; } .boot-subtitle { margin-bottom: 14px; } .boot-note { display: none; } }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="正在加载后室">
      <div class="boot-room" aria-hidden="true">
        <div class="boot-ceiling"></div><div class="boot-lamp"></div><div class="boot-lamp boot-lamp-far"></div>
        <div class="boot-wall"></div><div class="boot-wall boot-wall-right"></div><div class="boot-floor"></div><div class="boot-door"></div><div class="boot-shade"></div>
      </div>
      <div class="boot-top" aria-hidden="true"><span>ARCHIVE / 000</span><span>NO SIGNAL</span></div>
      <div class="boot-copy">
        <div class="boot-eyebrow">YOU HAVE BEEN HERE BEFORE</div>
        <h1 class="boot-title">后室：深入</h1>
        <p class="boot-subtitle">THE BACKROOMS</p>
        <div class="boot-track" aria-hidden="true"></div>
        <p id="boot-status">正在寻找入口……</p>
        <button id="boot-retry" type="button" hidden>重新连接</button>
        <p class="boot-note">荧光灯还亮着。请留在光亮处。</p>
        <noscript><p>请启用 JavaScript 后重新打开页面。</p></noscript>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // This also works when the module entry itself cannot be downloaded.
      (() => {
        const retry = document.getElementById('boot-retry');
        retry.onclick = () => location.reload();
        window.__bootSlowTimer = setTimeout(() => {
          const loader = document.getElementById('boot-loader');
          if (!loader || loader.dataset.state === 'ready' || loader.dataset.state === 'error') return;
          document.getElementById('boot-status').textContent = '入口仍在连接中，请稍候或重新连接。';
          retry.hidden = false;
        }, 15000);
        window.addEventListener('error', (event) => {
          if (event.target?.tagName !== 'SCRIPT' || event.target?.type !== 'module') return;
          clearTimeout(window.__bootSlowTimer);
          const loader = document.getElementById('boot-loader');
          if (!loader) return;
          loader.dataset.state = 'error';
          document.getElementById('boot-status').textContent = '入口连接失败，请重试。';
          retry.hidden = false;
        }, true);
      })();
    </script>
    <script id="app-entry" type="module" src="/src/main.tsx"></script>
  </body>
</html>
